<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: rgba(255,255,255,0.85);
      padding: 0;
    }

    .popup-wrap {
      padding: 18px 18px 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .header-icon {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: rgba(108,108,255,0.18);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .header-text {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
    }

    .header-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-top: 1px;
    }

    .field { margin-bottom: 10px; }

    label {
      display: block;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 8px 11px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    input:focus, select:focus {
      border-color: rgba(108,108,255,0.5);
      background: rgba(255,255,255,0.07);
    }

    input::placeholder { color: rgba(255,255,255,0.18); }
    select option { background: #1a1a2e; }
    select { cursor: pointer; }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 14px 0;
    }

    .btn-row { display: flex; gap: 8px; }

    button {
      flex: 1; padding: 9px;
      border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
    }

    .btn-save {
      background: rgba(108,108,255,0.75);
      color: #fff;
      letter-spacing: 0.01em;
      transition: filter 0.15s;
    }
    .btn-save:hover { filter: brightness(1.12); }
    .btn-save:disabled { opacity: 0.4; cursor: default; }

    .status {
      font-size: 12px; text-align: center;
      margin-top: 10px; color: rgba(255,255,255,0.3);
      min-height: 16px;
    }
    .status.ok { color: rgba(80,210,120,0.9); }
    .status.err { color: rgba(255,90,90,0.85); }

    /* Light theme */
    body.theme-light {
      background: #f5f5f7;
      color: rgba(0,0,0,0.8);
    }
    body.theme-light input,
    body.theme-light select {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.1);
      color: rgba(0,0,0,0.8);
    }
    body.theme-light input:focus,
    body.theme-light select:focus { border-color: rgba(108,108,255,0.5); background: rgba(0,0,0,0.07); }
    body.theme-light input::placeholder { color: rgba(0,0,0,0.25); }
    body.theme-light select option { background: #f5f5f7; color: rgba(0,0,0,0.8); }
    body.theme-light label { color: rgba(0,0,0,0.35); }
    body.theme-light .header-text { color: rgba(0,0,0,0.85); }
    body.theme-light .header-sub { color: rgba(0,0,0,0.4); }
    body.theme-light .divider { background: rgba(0,0,0,0.08); }
    body.theme-light .status { color: rgba(0,0,0,0.3); }
    body.theme-light kbd {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.12);
      color: rgba(0,0,0,0.5);
    }

    .shortcut-hint {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    kbd {
      display: inline-block;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="popup-wrap">
    <div class="header">
      <div class="header-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 2h10a1 1 0 011 1v11l-5-3-5 3V3a1 1 0 011-1z" stroke="rgba(108,108,255,0.9)" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div>
        <div class="header-text" data-i18n="popup.quickSave">Quick Save</div>
        <div class="header-sub" data-i18n="popup.saveTo">Save to Wallpaper</div>
      </div>
    </div>

    <div class="field">
      <label data-i18n="popup.url">URL</label>
      <input type="text" id="urlInput" placeholder="https://…" />
    </div>
    <div class="field">
      <label data-i18n="popup.title">Title</label>
      <input type="text" id="titleInput" placeholder="Page title" data-i18n-ph="popup.titlePlaceholder" />
    </div>
    <div class="field" id="pageField" style="display:none">
      <label data-i18n="popup.page">Page</label>
      <select id="pageSelect"></select>
    </div>
    <div class="field">
      <label data-i18n="popup.board">Board</label>
      <select id="boardSelect"></select>
    </div>

    <div class="divider"></div>

    <div class="btn-row">
      <button class="btn-save" id="saveBtn" data-i18n="popup.save">Save bookmark</button>
    </div>
    <div class="status" id="status"></div>

  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
